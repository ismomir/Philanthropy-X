<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philanthropy X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <!-- Левая часть: логотип и меню -->
            <div class="header-left">
                
                    <img src="Vector.png" alt="Logo" class="logo-icon">
                    <span class="logo-text">Philanthropy X</span>
                    <div class="header-line"></div>
                

                <nav class="nav">
                    <a href="#" class="nav-link">Home</a>
                    <a href="#" class="nav-link">About</a>
                    <a href="#" class="nav-link">Pages</a>
                </nav>
            </div>

            <!-- Правая часть: корзина и кнопка -->
            <div class="header-right">
                <div class="cart">
                    <img src="IMAGE.png" alt="Cart" class="cart-icon">
                    <span class="cart-badge">0</span>
                </div>

                <button class="btn-donate">Donate now</button>
            </div>
        </div>
    </header>
    <!-- +++++++++++++++++++++++++++++++++++++++++ -->
    <section class="hero">
        <div class="hero-inner">
            <!-- Левая часть с текстом и кнопками -->
            <div class="hero-left">
                <div class="hero-content">
                    <div class="hero-line"></div>
                    <h1 class="hero-title">Giving help to those who need it</h1>
                    <p class="hero-desc">
                        Lorem ipsum dolor sit amet consectetur adipiscing eli mattis sit phasellus mollis sit aliquam sit nullam.
                    </p>
                    <div class="hero-buttons">
                        <button class="btn-donate">Donate now</button>
                        <button class="btn-secondary">About our charity</button>
                    </div>
                </div>
            </div>

            <!-- Правая часть с фотографией -->
            <div class="hero-right">
                <img src="IMAGE (1).png" alt="Children smiling" class="hero-img">
            </div>
        </div>
    </section>
  <!-- +++++++++++++++++++++ -->
     <section class="stats-section">
        <div class="container">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number">200<span class="stat-accent">m</span></div>
                    <p class="stat-label">Humans impacted</p>
                </div>

                <div class="stat-item">
                    <div class="stat-number">50<span class="stat-accent">k</span></div>
                    <p class="stat-label">Collaborators</p>
                </div>

                <div class="stat-item">
                    <div class="stat-number">370<span class="stat-accent">k</span></div>
                    <p class="stat-label">Donations</p>
                </div>

                <div class="stat-item">
                    <div class="stat-number">100<span class="stat-accent">+</span></div>
                    <p class="stat-label">Assisted communities</p>
                </div>
            </div>

            <div class="section-divider"></div>
        </div>
    </section>

</body>
</html>
